<!DOCTYPE HTML>
<html lang="de">
<head>
  <title>Pool Sensor - Config</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topnav">
    <h1 id="title">Configuration</h1>
    <div style="margin-top: 0.5rem;"><a href="/" style="color: white; text-decoration: none; font-size: 0.875rem;">&larr; Back to Dashboard</a></div>
  </div>

  <div class="content">
    <div id="security-warning" class="card hide">
      <h2>Security Warning</h2>
      <p>DEBUG_SECURITY is enabled. Configuration is exposed.</p>
    </div>

    <div class="card">
      <h2>Sensor Settings</h2>
      <div class="config-group">
        <label for="cfg_name">Device Name</label>
        <input type="text" id="cfg_name" name="name" placeholder="e.g. Pool Sensor">
      </div>
      <div class="config-group">
        <label for="cfg_interval">Update Interval (seconds)</label>
        <input type="number" id="cfg_interval" name="interval" placeholder="900">
      </div>
      <div class="config-group">
        <label for="cfg_bleAddress">BLE MAC Address</label>
        <input type="text" id="cfg_bleAddress" name="bleAddress" placeholder="xx:xx:xx:xx:xx:xx">
      </div>
    </div>

    <div class="card">
      <h2>WiFi Settings</h2>
      <div class="config-group">
        <label>Available Networks</label>
        <template id="wifiTemplate">
          <li class="wifi-item">
            <span class="ssid"></span>
            <div>
              <span class="enc">🔒</span>
              <span class="wifi-rssi"></span>
            </div>
          </li>
        </template>
        <ul class="wifi-list" id="wifiList">
          <li class="status-info">Scanning for networks...</li>
        </ul>
      </div>
      <div class="config-group">
        <label for="cfg_wifiSSID">SSID</label>
        <input type="text" id="cfg_wifiSSID" name="wifiSSID" placeholder="WiFi SSID">
      </div>
      <div class="config-group">
        <label for="cfg_wifiPassword">Password</label>
        <div style="display: flex; gap: 0.5rem;">
          <input type="password" id="cfg_wifiPassword" name="wifiPassword" placeholder="WiFi Password">
          <button class="togglePassword button button-outline" for="cfg_wifiPassword" style="width: auto; margin: 0; padding: 0.5rem;">👁️</button>
        </div>
      </div>
      <div class="config-group">
        <label for="cfg_wifiTimeout">Disconnection Timeout (sec)</label>
        <input type="number" id="cfg_wifiTimeout" name="wifiTimeout" placeholder="600">
      </div>
    </div>

    <div class="card">
      <h2>Captive Portal</h2>
      <div class="config-group">
        <label for="cfg_portalSSID">Portal SSID</label>
        <input type="text" id="cfg_portalSSID" name="portalSSID" placeholder="Portal SSID">
      </div>
      <div class="config-group">
        <label for="cfg_portalPassword">Portal Password</label>
        <input type="text" id="cfg_portalPassword" name="portalPassword" placeholder="Portal Password">
      </div>
      <div class="config-group">
        <label for="cfg_portalTimeout">Portal Timeout (sec)</label>
        <input type="number" id="cfg_portalTimeout" name="portalTimeout" placeholder="600">
      </div>
    </div>

    <div class="card">
      <h2>MQTT Broker</h2>
      <div class="config-group">
        <label for="cfg_mqttServer">Server Address</label>
        <input type="text" id="cfg_mqttServer" name="mqttServer" placeholder="broker.mqtt.com">
      </div>
      <div class="config-group">
        <label for="cfg_mqttPort">Port</label>
        <input type="number" id="cfg_mqttPort" name="mqttPort" placeholder="1883">
      </div>
      <div class="config-group" style="display: flex; align-items: center; gap: 1rem;">
        <label for="cfg_mqttTLS" style="margin: 0;">Use TLS (Encrypted)</label>
        <input type="checkbox" id="cfg_mqttTLS" name="mqttTLS" style="width: auto;">
      </div>
      <div class="config-group">
        <label for="cfg_mqttTopic">Base Topic</label>
        <input type="text" id="cfg_mqttTopic" name="mqttTopic" placeholder="pool/sensor">
      </div>
      <div class="config-group">
        <label for="cfg_mqttUser">Username</label>
        <input type="text" id="cfg_mqttUser" name="mqttUser" placeholder="MQTT Username">
      </div>
      <div class="config-group">
        <label for="cfg_mqttPassword">Password</label>
        <div style="display: flex; gap: 0.5rem;">
          <input type="password" id="cfg_mqttPassword" name="mqttPassword" placeholder="MQTT Password">
          <button class="togglePassword button button-outline" for="cfg_mqttPassword" style="width: auto; margin: 0; padding: 0.5rem;">👁️</button>
        </div>
      </div>
    </div>

    <div class="card flex-center">
      <button id="btn_save" class="button button-primary">Save Configuration</button>
      <div class="status-info" style="width: 100%; text-align: center; margin-top: 1rem;">Device will reboot after saving.</div>
    </div>
  </div>

  <script>
    function fillSSID(ssid) {
      document.getElementById("cfg_wifiSSID").value = ssid;
    }

    function togglePassword(event) {
      var targetId = event.currentTarget.getAttribute("for");
      if (targetId) {
        var input = document.getElementById(targetId);
        if (input.getAttribute("type") === "password") {
          input.setAttribute("type", "text");
          event.currentTarget.textContent = "🙈";
        } else {
          input.setAttribute("type", "password");
          event.currentTarget.textContent = "👁️";
        }
      }
    }

    async function loadWifiListe() {
      try {
        const response = await fetch('wifiList');
        const data = await response.json();
        const wifiList = document.getElementById("wifiList");
        const template = document.getElementById("wifiTemplate");

        wifiList.innerHTML = "";
        if (data.length === 0) {
          wifiList.innerHTML = '<li class="status-info">No networks found.</li>';
          return;
        }

        for (const wifiEntry of data) {
          var clone = template.content.cloneNode(true);
          var li = clone.querySelector("li");
          li.onclick = function() { fillSSID(wifiEntry.ssid) };
          clone.querySelector(".ssid").textContent = wifiEntry.ssid;
          if (wifiEntry.enc == 0) clone.querySelector(".enc").style.display = "none";
          clone.querySelector(".wifi-rssi").textContent = wifiEntry.rssi + " dBm";
          wifiList.appendChild(clone);
        }
      } catch (e) {
        console.error("Failed to load WiFi list");
      }
    }

    window.addEventListener('load', () => {
      loadWifiListe();
      setInterval(loadWifiListe, 10000);

      fetch('config.json')
        .then(r => r.json())
        .then(data => {
          if (data.wifiPassword !== "***") {
            document.getElementById("security-warning").classList.remove("hide");
          }
          for (var key in data) {
            var el = document.getElementById("cfg_" + key);
            if (el) {
              if (el.type === "checkbox") el.checked = data[key];
              else el.value = data[key];
            }
          }
        });

      document.getElementById("btn_save").addEventListener("click", () => {
        var data = {};
        for (var el of document.querySelectorAll("input")) {
          var key = el.name;
          if (!key) continue;
          if (el.type === "checkbox") data[key] = el.checked;
          else if (el.type === "number") data[key] = parseInt(el.value);
          else data[key] = el.value.trim();
        }

        fetch('config.json', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        }).then(() => {
          alert("Configuration saved. The device is now rebooting...");
          setTimeout(() => { window.location.href = '/'; }, 2000);
        });
      });

      for (var el of document.querySelectorAll(".togglePassword")) {
        el.addEventListener("click", togglePassword);
      }
    });
  </script>
</body>
</html>
